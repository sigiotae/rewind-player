name: Update song list

on:
  schedule:
    - cron: "17 18 * * *"   # 매일 한국시간 03:17
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: update-songs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build songs.json
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/build_songs.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/songs.json data/video_cache.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "곡 목록 자동 업데이트 $(date -u +%F)"
            git push
          fi
